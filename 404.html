<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>404 — Lost in Space | Vura AI</title>
<meta name="description" content="This page drifted out of orbit. Let's get you back on track with Vura AI."/>
<link rel="icon" type="image/png" href="vura-logo.png"/>
<link rel="apple-touch-icon" href="vura-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" defer></script>
<style>
/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Nunito',sans-serif;
  background:#03030b;color:#e8e8f0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;position:relative;
  min-height:100vh;
}

/* ============================================================
   VARIABLES
   ============================================================ */
:root{
  --blue:#00d2ff;
  --purple:#9d50bb;
  --gold:#ffcc33;
  --green:#10b981;
  --bg:#03030b;
  --muted:#8888aa;
  --grad:linear-gradient(135deg,#00d2ff,#9d50bb);
}

/* ============================================================
   CANVAS LAYERS
   ============================================================ */
#star-canvas{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}

/* ============================================================
   NEBULA
   ============================================================ */
.nebula{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.nb{position:absolute;border-radius:50%}
.nb1{
  width:700px;height:700px;top:-250px;left:-200px;
  background:radial-gradient(circle,rgba(157,80,187,.16) 0%,transparent 65%);
  animation:nbPulse 12s ease-in-out infinite alternate;
}
.nb2{
  width:600px;height:600px;bottom:-200px;right:-150px;
  background:radial-gradient(circle,rgba(0,210,255,.13) 0%,transparent 65%);
  animation:nbPulse 15s ease-in-out infinite alternate-reverse;
}
.nb3{
  width:400px;height:400px;top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,204,51,.05) 0%,transparent 60%);
  animation:nbPulse 20s ease-in-out infinite;
}
@keyframes nbPulse{
  0%{transform:scale(1) translate(0,0)}
  50%{transform:scale(1.1) translate(20px,15px)}
  100%{transform:scale(1.05) translate(-10px,10px)}
}
.nb3{animation-name:nbPulse3}
@keyframes nbPulse3{
  0%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.15)}
  100%{transform:translate(-50%,-50%) scale(0.95)}
}

/* ============================================================
   PARALLAX WRAPPER
   ============================================================ */
#parallax-root{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  width:100%;
  padding:20px 24px;
  will-change:transform;
}

/* ============================================================
   TOP BAR
   ============================================================ */
.top-bar{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;z-index:100;
  animation:slideDown .6s cubic-bezier(.34,1.56,.64,1) .2s both;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.logo{
  font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:900;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;letter-spacing:2px;text-decoration:none;
}
.home-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 20px;border-radius:50px;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.12);
  color:#fff;font-size:.85rem;font-weight:700;
  cursor:pointer;transition:.3s cubic-bezier(.4,0,.2,1);
  text-decoration:none;font-family:'Nunito',sans-serif;
}
.home-btn:hover{
  background:rgba(0,210,255,.1);border-color:rgba(0,210,255,.3);
  color:var(--blue);transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(0,210,255,.15);
}

/* ============================================================
   LOTTIE CONTAINER
   ============================================================ */
.lottie-wrap{
  width:300px;height:300px;
  position:relative;
  opacity:0;
  animation:lottieIn .8s cubic-bezier(.34,1.56,.64,1) .3s both;
  flex-shrink:0;
}
@keyframes lottieIn{
  from{opacity:0;transform:scale(.6) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
#lottie-container{width:100%;height:100%}

/* CSS fallback animation (shows if Lottie fails) */
.lottie-fallback{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  display:none;
}
.astronaut-css{
  width:120px;height:120px;
  animation:astFloat 4s ease-in-out infinite;
  position:relative;
}
@keyframes astFloat{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-24px) rotate(5deg)}
}
/* Simple SVG astronaut */
.astronaut-css svg{width:100%;height:100%}

/* ============================================================
   404 GLITCH
   ============================================================ */
.glitch-wrap{
  position:relative;margin:4px 0 8px;
  opacity:0;
  animation:glitchEntrance 1s cubic-bezier(.34,1.56,.64,1) .6s both;
}
@keyframes glitchEntrance{
  0%{opacity:0;transform:scale(1.4) skew(6deg);filter:blur(8px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:scale(1) skew(0);filter:blur(0)}
}

.glitch-text{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(6rem,18vw,9rem);
  font-weight:900;
  color:transparent;
  -webkit-text-stroke:2px var(--blue);
  position:relative;
  letter-spacing:.04em;
  line-height:1;
  animation:colorCycle 3s linear infinite;
  display:block;
  user-select:none;
}
@keyframes colorCycle{
  0%,100%{-webkit-text-stroke-color:var(--blue);filter:drop-shadow(0 0 20px rgba(0,210,255,.5))}
  33%{-webkit-text-stroke-color:var(--purple);filter:drop-shadow(0 0 20px rgba(157,80,187,.5))}
  66%{-webkit-text-stroke-color:var(--gold);filter:drop-shadow(0 0 20px rgba(255,204,51,.5))}
}

/* Glitch layers */
.glitch-text::before,
.glitch-text::after{
  content:'404';
  position:absolute;inset:0;
  font-family:'Orbitron',sans-serif;
  font-size:inherit;font-weight:900;
  -webkit-text-stroke:2px transparent;
  left:0;top:0;
}
.glitch-text::before{
  color:var(--blue);
  clip-path:polygon(0 0,100% 0,100% 35%,0 35%);
  animation:glitchTop 2.5s ease-in-out infinite;
  opacity:.7;
}
.glitch-text::after{
  color:var(--purple);
  clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);
  animation:glitchBot 2.5s ease-in-out infinite;
  opacity:.7;
}
@keyframes glitchTop{
  0%,90%,100%{transform:translate(0);opacity:0}
  91%{transform:translate(-4px,2px);opacity:.7}
  93%{transform:translate(4px,-2px);opacity:.5}
  95%{transform:translate(-2px,1px);opacity:.7}
  97%{transform:translate(0);opacity:0}
}
@keyframes glitchBot{
  0%,85%,100%{transform:translate(0);opacity:0}
  86%{transform:translate(4px,-2px);opacity:.6}
  88%{transform:translate(-3px,3px);opacity:.4}
  90%{transform:translate(3px,-1px);opacity:.6}
  92%{transform:translate(0);opacity:0}
}

/* Flicker scanline over 404 */
.glitch-scanline{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.glitch-scanline::after{
  content:'';position:absolute;
  width:100%;height:3px;
  background:rgba(0,210,255,.25);
  animation:scanline 3s linear infinite;
  top:-10px;
}
@keyframes scanline{from{top:-10%}to{top:110%}}

/* ============================================================
   HEADLINE
   ============================================================ */
.headline{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.4rem,4vw,2rem);
  font-weight:700;color:#fff;
  margin-bottom:12px;
  opacity:0;
  animation:fadeSlideUp .7s ease .95s both;
  animation-timing-function:cubic-bezier(.34,1.56,.64,1);
}
@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:translateY(0)}
}

/* Typing cursor on headline */
.headline::after{
  content:'|';color:var(--blue);
  animation:blink .8s step-end infinite;
  margin-left:2px;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ============================================================
   SUBTITLE
   ============================================================ */
.subtitle{
  font-size:clamp(.9rem,2.5vw,1.05rem);
  color:var(--muted);
  max-width:480px;
  line-height:1.7;
  margin-bottom:36px;
  opacity:0;
  animation:fadeSlideUp .7s ease 1.1s both;
  animation:floatText 5s ease-in-out 1.1s both;
}
@keyframes floatText{
  0%{opacity:0;transform:translateY(20px)}
  20%{opacity:1;transform:translateY(0)}
  60%{transform:translateY(-4px)}
  80%{transform:translateY(4px)}
  100%{opacity:1;transform:translateY(0)}
}
.subtitle em{color:var(--blue);font-style:normal;font-weight:700}

/* Gentle float loop after entrance */
.subtitle.loaded{animation:gentleFloat 6s ease-in-out infinite}
@keyframes gentleFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn-group{
  display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
  opacity:0;
  animation:fadeSlideUp .7s cubic-bezier(.34,1.56,.64,1) 1.25s both;
  margin-bottom:40px;
}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:14px 32px;border-radius:50px;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;
  cursor:pointer;transition:.35s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
  min-height:50px;text-decoration:none;
  letter-spacing:.3px;
}

/* Primary */
.btn-primary{
  background:var(--grad);color:#fff;
  border:none;
  box-shadow:0 0 30px rgba(0,210,255,.2),0 4px 20px rgba(0,0,0,.3);
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:translateX(-100%);transition:.6s;
}
.btn-primary:hover::before{transform:translateX(100%)}
.btn-primary:hover{
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 12px 40px rgba(0,210,255,.4),0 0 60px rgba(0,210,255,.15);
}
.btn-primary:active{transform:scale(.98)}

/* Secondary */
.btn-secondary{
  background:transparent;color:#fff;
  border:1.5px solid rgba(255,255,255,.2);
}
.btn-secondary:hover{
  background:rgba(0,210,255,.08);
  border-color:var(--blue);color:var(--blue);
  transform:translateY(-3px);
  box-shadow:0 8px 30px rgba(0,210,255,.15);
}
.btn-secondary:active{transform:scale(.98)}

/* Ripple */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.25);
  transform:scale(0);animation:rippleAnim .6s linear;
  pointer-events:none;
}
@keyframes rippleAnim{
  to{transform:scale(4);opacity:0}
}

/* ============================================================
   QUICK LINKS
   ============================================================ */
.quick-links{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
}
.ql-label{
  font-size:.78rem;color:rgba(136,136,170,.5);
  font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  margin-right:4px;
}
.ql-link{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:50px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  color:var(--muted);font-size:.82rem;font-weight:700;
  text-decoration:none;transition:.3s ease;
  opacity:0;
}
.ql-link:hover{
  background:rgba(0,210,255,.07);border-color:rgba(0,210,255,.2);
  color:var(--blue);transform:translateY(-2px);
}
.ql-link:nth-child(2){animation:fadeSlideUp .5s ease 1.55s both}
.ql-link:nth-child(3){animation:fadeSlideUp .5s ease 1.65s both}
.ql-link:nth-child(4){animation:fadeSlideUp .5s ease 1.75s both}

/* Dot separator */
.ql-sep{
  width:3px;height:3px;border-radius:50%;
  background:rgba(136,136,170,.3);
  flex-shrink:0;
  opacity:0;animation:fadeSlideUp .5s ease 1.7s both;
}

/* ============================================================
   FLOATING PARTICLES (CSS)
   ============================================================ */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.p{
  position:absolute;border-radius:50%;
  animation:particleDrift linear infinite;
  opacity:0;
}
@keyframes particleDrift{
  0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0}
  10%{opacity:var(--pa)}
  90%{opacity:var(--pa)}
  100%{transform:translateY(-100px) translateX(var(--px)) scale(1.5);opacity:0}
}

/* Hex grid overlay — subtle */
.hex-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,210,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,210,255,.025) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,black 0%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,black 0%,transparent 100%);
}

/* ============================================================
   ORBIT RING (decorative)
   ============================================================ */
.orbit-ring{
  position:absolute;
  border-radius:50%;
  border:1px dashed;
  animation:orbitSpin linear infinite;
  pointer-events:none;
}
.or1{
  width:380px;height:380px;
  border-color:rgba(0,210,255,.08);
  top:50%;left:50%;transform:translate(-50%,-50%);
  animation-duration:25s;
  opacity:0;animation:orbitFadeIn 1s ease 1.5s both, orbitSpin 25s linear 1.5s infinite;
}
.or2{
  width:500px;height:500px;
  border-color:rgba(157,80,187,.06);
  top:50%;left:50%;transform:translate(-50%,-50%);
  animation-duration:35s;
  opacity:0;animation:orbitFadeIn 1s ease 1.7s both, orbitSpin2 35s linear 1.7s infinite;
}
.orbit-dot{
  position:absolute;width:8px;height:8px;border-radius:50%;
  top:-4px;left:50%;margin-left:-4px;
  box-shadow:0 0 12px currentColor;
}
.or1 .orbit-dot{background:var(--blue);color:var(--blue)}
.or2 .orbit-dot{background:var(--purple);color:var(--purple)}

@keyframes orbitFadeIn{from{opacity:0}to{opacity:1}}
@keyframes orbitSpin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
@keyframes orbitSpin2{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(-360deg)}
}

/* ============================================================
   COMET / SHOOTING STAR
   ============================================================ */
.comet{
  position:fixed;width:2px;height:80px;
  background:linear-gradient(transparent,rgba(0,210,255,.7),transparent);
  transform:rotate(135deg);
  opacity:0;
  animation:cometFly 8s ease-in-out infinite;
  pointer-events:none;z-index:0;
}
.comet:nth-child(1){top:10%;left:20%;animation-delay:1s;animation-duration:6s}
.comet:nth-child(2){top:30%;left:70%;animation-delay:4s;animation-duration:9s}
.comet:nth-child(3){top:60%;left:10%;animation-delay:7s;animation-duration:7s}
@keyframes cometFly{
  0%{opacity:0;transform:rotate(135deg) translateX(0)}
  5%{opacity:.8}
  30%{opacity:.8;transform:rotate(135deg) translateX(400px)}
  35%{opacity:0}
  100%{opacity:0;transform:rotate(135deg) translateX(400px)}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:640px){
  .lottie-wrap{width:200px;height:200px}
  .glitch-text{font-size:clamp(4.5rem,22vw,7rem)}
  .btn-group{flex-direction:column;align-items:center}
  .btn{width:240px;justify-content:center}
  .or1,.or2{display:none}
  .top-bar{padding:14px 18px}
  html,body{overflow-y:auto}
}
@media(max-width:380px){
  .lottie-wrap{width:160px;height:160px}
  .glitch-text{font-size:clamp(4rem,24vw,6rem)}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- Layers -->
<canvas id="star-canvas"></canvas>
<div class="nebula"><div class="nb"></div><div class="nb nb1"></div><div class="nb nb2"></div><div class="nb nb3"></div></div>
<div class="hex-grid"></div>
<div class="particles" id="particleContainer"></div>

<!-- Comets -->
<div class="comet"></div>
<div class="comet"></div>
<div class="comet"></div>

<!-- Orbit rings (behind content) -->
<div class="orbit-ring or1"><div class="orbit-dot"></div></div>
<div class="orbit-ring or2"><div class="orbit-dot"></div></div>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="index.html" class="logo">VURA AI</a>
  <a href="index.html" class="home-btn">
    <i class="fa-solid fa-house"></i> Home
  </a>
</div>

<!-- MAIN CONTENT -->
<div id="parallax-root">

  <!-- Lottie -->
  <div class="lottie-wrap" id="lottieWrap">
    <div id="lottie-container"></div>
    <!-- CSS fallback -->
    <div class="lottie-fallback" id="lottieFallback">
      <svg class="astronaut-css" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Helmet -->
        <circle cx="100" cy="75" r="38" fill="rgba(13,13,40,.9)" stroke="#00d2ff" stroke-width="3"/>
        <circle cx="100" cy="75" r="28" fill="rgba(0,210,255,.08)" stroke="rgba(0,210,255,.25)" stroke-width="1.5"/>
        <!-- Visor shine -->
        <ellipse cx="92" cy="65" rx="10" ry="6" fill="rgba(255,255,255,.18)" transform="rotate(-20 92 65)"/>
        <!-- Body suit -->
        <rect x="72" y="108" width="56" height="52" rx="18" fill="rgba(13,13,40,.9)" stroke="#9d50bb" stroke-width="2.5"/>
        <!-- Chest panel -->
        <rect x="86" y="118" width="28" height="18" rx="6" fill="rgba(157,80,187,.15)" stroke="rgba(157,80,187,.4)" stroke-width="1"/>
        <circle cx="95" cy="127" r="3" fill="#00d2ff" opacity=".8"/>
        <circle cx="105" cy="127" r="3" fill="#ffcc33" opacity=".8"/>
        <!-- Left arm -->
        <rect x="50" y="112" width="22" height="38" rx="11" fill="rgba(13,13,40,.9)" stroke="#9d50bb" stroke-width="2" transform="rotate(12 61 131)"/>
        <!-- Right arm -->
        <rect x="128" y="112" width="22" height="38" rx="11" fill="rgba(13,13,40,.9)" stroke="#9d50bb" stroke-width="2" transform="rotate(-12 139 131)"/>
        <!-- Gloves -->
        <circle cx="47" cy="152" r="10" fill="#00d2ff" opacity=".6"/>
        <circle cx="153" cy="152" r="10" fill="#00d2ff" opacity=".6"/>
        <!-- Legs -->
        <rect x="76" y="156" width="20" height="30" rx="10" fill="rgba(13,13,40,.9)" stroke="#9d50bb" stroke-width="2"/>
        <rect x="104" y="156" width="20" height="30" rx="10" fill="rgba(13,13,40,.9)" stroke="#9d50bb" stroke-width="2"/>
        <!-- Boots -->
        <ellipse cx="86" cy="186" rx="12" ry="6" fill="#00d2ff" opacity=".5"/>
        <ellipse cx="114" cy="186" rx="12" ry="6" fill="#00d2ff" opacity=".5"/>
        <!-- Backpack thruster -->
        <rect x="65" y="115" width="12" height="40" rx="6" fill="rgba(0,210,255,.15)" stroke="rgba(0,210,255,.3)" stroke-width="1"/>
        <!-- Thruster flame -->
        <ellipse cx="71" cy="160" rx="5" ry="8" fill="url(#flameGrad)" opacity=".8"/>
        <defs>
          <radialGradient id="flameGrad" cx="50%" cy="0%" r="100%">
            <stop offset="0%" stop-color="#fff" stop-opacity=".9"/>
            <stop offset="50%" stop-color="#00d2ff" stop-opacity=".8"/>
            <stop offset="100%" stop-color="#9d50bb" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- Stars around astronaut -->
        <circle cx="30" cy="40" r="2" fill="#fff" opacity=".7"/>
        <circle cx="170" cy="30" r="1.5" fill="#ffcc33" opacity=".8"/>
        <circle cx="160" cy="160" r="2" fill="#fff" opacity=".5"/>
        <circle cx="25" cy="140" r="1.5" fill="#9d50bb" opacity=".8"/>
        <circle cx="155" cy="90" r="1" fill="#fff" opacity=".6"/>
      </svg>
    </div>
  </div>

  <!-- 404 glitch -->
  <div class="glitch-wrap" id="glitchWrap">
    <div class="glitch-scanline"></div>
    <span class="glitch-text" id="glitchText">404</span>
  </div>

  <!-- Headline -->
  <h1 class="headline" id="headline">Lost in Space</h1>

  <!-- Subtitle -->
  <p class="subtitle" id="subtitle">
    This page drifted <em>out of orbit</em>. Let's get you back on track — your exams won't wait.
  </p>

  <!-- Buttons -->
  <div class="btn-group">
    <a href="index.html" class="btn btn-primary" id="btnHome">
      <i class="fa-solid fa-rocket"></i> Go Home
    </a>
    <button class="btn btn-secondary" id="btnBack" onclick="history.back()">
      <i class="fa-solid fa-arrow-left"></i> Go Back
    </button>
  </div>

  <!-- Quick links -->
  <div class="quick-links">
    <span class="ql-label">Quick Links</span>
    <a href="blog.html" class="ql-link">
      <i class="fa-solid fa-newspaper" style="font-size:.75rem;color:var(--blue)"></i> Blog
    </a>
    <div class="ql-sep"></div>
    <a href="index.html#faq" class="ql-link">
      <i class="fa-solid fa-circle-question" style="font-size:.75rem;color:var(--gold)"></i> FAQs
    </a>
    <div class="ql-sep"></div>
    <a href="index.html#contact" class="ql-link">
      <i class="fa-solid fa-headset" style="font-size:.75rem;color:var(--green)"></i> Contact Support
    </a>
  </div>

</div><!-- /parallax-root -->

<script>
/* ============================================================
   STARS CANVAS
   ============================================================ */
(function() {
  const canvas = document.getElementById('star-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H;
  const stars  = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 220; i++) {
    stars.push({
      x:  Math.random() * 2000,
      y:  Math.random() * 2000,
      r:  Math.random() * 1.5 + 0.2,
      a:  Math.random() * 0.7 + 0.1,
      sp: Math.random() * 0.004 + 0.001,
      ph: Math.random() * Math.PI * 2,
    });
  }

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    t++;
    stars.forEach(s => {
      const a = s.a * (0.45 + 0.55 * Math.sin(t * s.sp * 60 + s.ph));
      ctx.beginPath();
      ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ============================================================
   CSS PARTICLES
   ============================================================ */
(function() {
  const cont   = document.getElementById('particleContainer');
  const colors = ['#00d2ff','#9d50bb','#ffcc33','#10b981','#ffffff'];
  const count  = 28;

  for (let i = 0; i < count; i++) {
    const p    = document.createElement('div');
    p.className = 'p';
    const size  = Math.random() * 5 + 2;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const dur   = Math.random() * 18 + 12;
    const delay = Math.random() * 20;
    const left  = Math.random() * 100;
    const px    = (Math.random() - 0.5) * 200;
    const pa    = Math.random() * 0.4 + 0.1;

    p.style.cssText = `
      width:${size}px;height:${size}px;
      background:${color};
      left:${left}%;
      --px:${px}px;--pa:${pa};
      animation-duration:${dur}s;
      animation-delay:${delay}s;
      box-shadow:0 0 ${size * 2}px ${color};
    `;
    cont.appendChild(p);
  }
})();

/* ============================================================
   LOTTIE LOAD (with timeout fallback)
   ============================================================ */
let lottieLoaded = false;

window.addEventListener('load', function() {
  if (typeof lottie === 'undefined') {
    showFallback();
    return;
  }

  // Try multiple free Lottie animation URLs
  const urls = [
    'https://assets10.lottiefiles.com/packages/lf20_kcsr6fcp.json',   // astronaut floating
    'https://assets2.lottiefiles.com/packages/lf20_rnrSt2.json',       // 404 space
    'https://assets9.lottiefiles.com/packages/lf20_rbtuurmb.json',     // space robot
  ];

  let urlIndex = 0;

  function tryLoadLottie(url) {
    const anim = lottie.loadAnimation({
      container:  document.getElementById('lottie-container'),
      renderer:   'svg',
      loop:       true,
      autoplay:   true,
      path:       url,
    });

    anim.addEventListener('DOMLoaded', () => {
      lottieLoaded = true;
      document.getElementById('lottieFallback').style.display = 'none';
    });

    anim.addEventListener('data_failed', () => {
      anim.destroy();
      urlIndex++;
      if (urlIndex < urls.length) {
        document.getElementById('lottie-container').innerHTML = '';
        tryLoadLottie(urls[urlIndex]);
      } else {
        showFallback();
      }
    });

    // Hard timeout — show fallback if nothing loads in 4s
    setTimeout(() => {
      if (!lottieLoaded) {
        try { anim.destroy(); } catch(e) {}
        showFallback();
      }
    }, 4000);
  }

  tryLoadLottie(urls[0]);
});

function showFallback() {
  document.getElementById('lottie-container').style.display = 'none';
  const fb = document.getElementById('lottieFallback');
  fb.style.display = 'flex';
}

/* ============================================================
   MOUSE PARALLAX (desktop only)
   ============================================================ */
const isMobile = () => window.innerWidth < 640;
const root     = document.getElementById('parallax-root');
let mouseX = 0, mouseY = 0;
let curX   = 0, curY   = 0;

document.addEventListener('mousemove', (e) => {
  if (isMobile()) return;
  mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// Smooth lerp parallax
function parallaxLoop() {
  if (!isMobile()) {
    curX += (mouseX - curX) * 0.06;
    curY += (mouseY - curY) * 0.06;
    root.style.transform = `translate(${curX * 10}px, ${curY * 8}px)`;
  }
  requestAnimationFrame(parallaxLoop);
}
parallaxLoop();

/* ============================================================
   RIPPLE EFFECT ON BUTTONS
   ============================================================ */
function addRipple(e) {
  const btn    = e.currentTarget;
  const rect   = btn.getBoundingClientRect();
  const x      = e.clientX - rect.left;
  const y      = e.clientY - rect.top;
  const size   = Math.max(rect.width, rect.height) * 2;

  const rip    = document.createElement('span');
  rip.className = 'ripple';
  rip.style.cssText = `
    width:${size}px;height:${size}px;
    left:${x - size/2}px;
    top:${y - size/2}px;
  `;
  btn.appendChild(rip);
  setTimeout(() => rip.remove(), 650);
}

document.getElementById('btnHome').addEventListener('click', addRipple);
document.getElementById('btnBack').addEventListener('click', addRipple);

/* ============================================================
   SUBTITLE FLOAT (after entrance)
   ============================================================ */
setTimeout(() => {
  const sub = document.getElementById('subtitle');
  sub.classList.add('loaded');
}, 4000);

/* ============================================================
   HEADLINE TYPING EFFECT
   ============================================================ */
(function() {
  const h   = document.getElementById('headline');
  const txt = 'Lost in Space';
  h.textContent = '';

  // Start typing after entrance delay
  setTimeout(() => {
    let i = 0;
    const timer = setInterval(() => {
      h.textContent = txt.slice(0, ++i);
      if (i >= txt.length) clearInterval(timer);
    }, 75);
  }, 950);
})();

/* ============================================================
   RANDOM GLITCH BURST (periodic)
   ============================================================ */
(function() {
  function randomGlitch() {
    const gt = document.getElementById('glitchText');
    gt.style.filter = `hue-rotate(${Math.random()*360}deg) brightness(1.5)`;
    gt.style.transform = `translate(${(Math.random()-0.5)*6}px,${(Math.random()-0.5)*4}px) skew(${(Math.random()-0.5)*4}deg)`;
    setTimeout(() => {
      gt.style.filter = '';
      gt.style.transform = '';
    }, 100 + Math.random() * 100);
  }

  // Trigger random glitch every 3-7 seconds
  function scheduleGlitch() {
    setTimeout(() => {
      randomGlitch();
      if (Math.random() > 0.5) {
        setTimeout(randomGlitch, 150);
      }
      scheduleGlitch();
    }, 3000 + Math.random() * 4000);
  }
  scheduleGlitch();
})();
</script>
</body>
